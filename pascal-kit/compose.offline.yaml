# Pascal(P100) 离线开箱编排：镜像自带模型与运行参数，无需外挂 volume / 环境变量
services:
  paddleocr-vl-pascal:
    image: paddleocr-vl-pascal:offline
    container_name: paddleocr-vl-pascal
    ports:
      - "18081:8080"
    volumes:
      - ./test_api.py:/home/paddleocr/test_api.py:ro
      - ./samples:/home/paddleocr/samples:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_ID:-1}"]
              capabilities: [gpu]
    shm_size: 8g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      start_period: 900s
      interval: 30s
      retries: 10
